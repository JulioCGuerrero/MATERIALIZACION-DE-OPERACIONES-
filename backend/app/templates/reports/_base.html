<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <style>
    @page { size: A4; margin: 20mm 14mm; }
    body { font-family: DejaVu Sans, Arial, sans-serif; color:#0f172a; font-size:11px; }
    .header { border-bottom: 2px solid #1d4ed8; padding-bottom:10px; margin-bottom:14px; }
    .brand { font-size:20px; font-weight:800; color:#1e3a8a; letter-spacing:.4px; }
    .sub { color:#334155; margin-top:2px; }
    .meta { color:#64748b; font-size:10px; margin-top:3px; }
    .title { font-size:18px; font-weight:700; margin:8px 0 4px; color:#0f172a; }
    .kpis { display:flex; gap:8px; margin:10px 0 14px; }
    .kpi { flex:1; border:1px solid #cbd5e1; border-radius:8px; padding:8px; background:#f8fafc; }
    .kpi .l { color:#475569; font-size:10px; text-transform:uppercase; letter-spacing:.4px; }
    .kpi .v { font-size:18px; font-weight:700; margin-top:2px; }
    table { width:100%; border-collapse: collapse; margin-top:6px; }
    th { text-align:left; background:#1e293b; color:white; padding:7px; font-size:10px; }
    td { border-bottom:1px solid #e2e8f0; padding:7px; vertical-align:top; }
    .badge { display:inline-block; padding:2px 7px; border-radius:999px; font-size:10px; font-weight:700; }
    .ok { background:#dcfce7; color:#166534; }
    .warn { background:#fef3c7; color:#92400e; }
    .bad { background:#fee2e2; color:#991b1b; }
    .mono { font-family: DejaVu Sans Mono, monospace; }
    .foot { margin-top:12px; color:#64748b; font-size:10px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .card { border:1px solid #cbd5e1; border-radius:8px; padding:8px; background:#f8fafc; }
    .state-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
