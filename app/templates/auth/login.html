{% extends "base.html" %}
{% block title %}Acceso | Servicia{% endblock %}
{% block content %}
<section class="card auth-card" aria-labelledby="login-title">
  <h1 id="login-title">Acceso al sistema</h1>
  <p>Usa tu correo piloto de Batia y la contraseña inicial: <code>servicia2026</code>.</p>

  <form method="post" class="form-grid" novalidate>
    <label for="email">Correo</label>
    <input id="email" name="email" type="email" required autocomplete="email" placeholder="usuario@batia.local">

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">

    <button class="btn" type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
