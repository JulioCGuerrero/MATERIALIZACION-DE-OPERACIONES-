{% extends "base.html" %}
{% block title %}Nuevo Folio | Servicia{% endblock %}
{% block content %}
<section class="card">
  <h1>Nuevo folio SINGA</h1>
  <p>Regla activa: solo proveedores con cuenta autorizada por Dirección.</p>

  <form method="post" class="form-grid" novalidate>
    <label for="singa_number">Número de folio SINGA</label>
    <input id="singa_number" name="singa_number" type="text" required placeholder="#17199">

    <label for="provider_id">Proveedor autorizado</label>
    <select id="provider_id" name="provider_id" required>
      <option value="">Selecciona proveedor</option>
      {% for provider in providers %}
      <option value="{{ provider.id }}">{{ provider.name }} ({{ provider.provider_type }})</option>
      {% endfor %}
    </select>

    <label for="communication_responsible">Responsable de comunicación</label>
    <input id="communication_responsible" name="communication_responsible" type="text" required>

    <label for="contract_amount">Monto contrato</label>
    <input id="contract_amount" name="contract_amount" type="number" step="0.01" min="0" required>

    <label for="budget_amount">Presupuesto SINGA autorizado</label>
    <input id="budget_amount" name="budget_amount" type="number" step="0.01" min="0.01" required>

    <button class="btn" type="submit">Guardar folio</button>
  </form>
</section>
{% endblock %}
